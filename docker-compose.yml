services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: perfume_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: perfumedb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 2. MinIO Object Storage (Using quay.io mirror)
  minio:
    image: quay.io/minio/minio:latest
    container_name: perfume_minio
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Dashboard
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

  # 3. MinIO Auto Bucket Creator (Using quay.io mirror)
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: perfume_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO to be healthy...';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing local/perfumes;
      /usr/bin/mc anonymous set download local/perfumes;
      echo 'Bucket perfumes ready.';
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
