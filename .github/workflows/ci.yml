name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    # Keep app runtime and mock secrets at the top, but DO NOT put NODE_ENV: production here
    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/perfume_shop_ci"
      BETTER_AUTH_SECRET: "ci-mock-auth-secret-key-32-characters-min"
      BETTER_AUTH_URL: "http://localhost:3000"
      MINIO_ENDPOINT: "http://localhost:9000"
      MINIO_ACCESS_KEY: "mock-access-key"
      MINIO_SECRET_KEY: "mock-secret-key"
      MINIO_BUCKET_NAME: "mock-bucket"
      NEXT_PUBLIC_BASE_URL: "http://localhost:3000"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: perfume_shop_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        # --prod=false explicitly forces pnpm to install devDependencies like eslint and typescript
        run: pnpm install --frozen-lockfile --prod=false

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript Check
        run: pnpm run typecheck

      - name: Run Drizzle Migrations on CI Database
        run: pnpm run db:migrate

      - name: Build Next.js Application
        # NODE_ENV: production is scoped only to the build step
        env:
          NODE_ENV: production
        run: pnpm run build
